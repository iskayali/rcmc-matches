/* =========================
   MESSAGE
========================= */

function showMessage(text, type = "success") {

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message " + type;

  setTimeout(() => {
    box.className = "message";
  }, 4000);
}


/* =========================
   LOAD STAGES
========================= */

async function loadStages() {
  const { data, error } =
    await supabaseClient
      .from("stages")
      .select("*")
      .order("stage_order", {
        ascending: true
      });

  if (error) {
    console.error(error);

    showMessage(
      "تعذر تحميل المراحل.",
      "error"
    );

    return;
  }

  stages = data || [];
}

/* =========================
   LOAD MATCHES
========================= */

async function loadMatches() {

  const { data, error } =
    await supabaseClient
      .from("matches")
      .select(`
        *,
        stages (
          id,
          name,
          stage_order
        )
      `)
      .order("kickoff", {
        ascending: true
      });

  if (error) {

    console.error(error);

    document.getElementById("matches").innerHTML =
      `<div class="empty">
        حدث خطأ أثناء تحميل المباريات.
      </div>`;

    return;
  }

  renderMatches(data || []);
}


/* =========================
   RENDER MATCHES
========================= */

function renderMatches(matches) {

  const container =
    document.getElementById("matches");

  if (!matches.length) {

    container.innerHTML =
      `<div class="empty">
        لا توجد مباريات حاليًا.
      </div>`;

    return;
  }

  container.innerHTML =
    matches.map(match => {

      const finished =
        match.status === "finished";

      const stageName =
        match.stages?.name || "بدون مرحلة";

      return `

        <div class="match">

          <div class="match-header">

            <span class="stage-name">
              ${escapeHtml(stageName)}
            </span>

            <span class="match-id">
              #${match.id}
            </span>

          </div>


          <div class="teams">

            <span>
              ${escapeHtml(match.home_team)}
            </span>

            <span class="vs">
              VS
            </span>

            <span>
              ${escapeHtml(match.away_team)}
            </span>

          </div>


          <div class="info">
            موعد المباراة:
            ${formatDate(match.kickoff)}
          </div>


          <div class="status ${
            finished
              ? "finished"
              : "scheduled"
          }">

            الحالة:
            ${
              finished
                ? "انتهت"
                : "مجدولة"
            }

          </div>


          ${
            finished
              ? `
                <div class="score-display">
                  ${match.home_score}
                  -
                  ${match.away_score}
                </div>
              `
              : `
                <div class="score-row">

                  <input
                    id="home-${match.id}"
                    type="number"
                    min="0"
                    placeholder="Home"
                  >

                  <input
                    id="away-${match.id}"
                    type="number"
                    min="0"
                    placeholder="Away"
                  >

                </div>
              `
          }


          <button
            class="secondary"
            onclick="editMatch(${match.id})">

            ✏️ تعديل المباراة

          </button>


          ${
            !finished
              ? `
                <button
                  class="primary"
                  onclick="finishMatch(${match.id})">

                  🏁 إنهاء المباراة وإدخال النتيجة

                </button>
              `
              : `
                <button
                  class="primary"
                  onclick="editResult(${match.id})">

                  📝 تعديل النتيجة

                </button>

                <button
                  class="secondary"
                  onclick="scoreMatch(${match.id})">

                  🏆 احتساب النقاط

                </button>
              `
          }


          <button
            class="danger"
            onclick="deleteMatch(${match.id})">

            🗑️ حذف المباراة

          </button>

        </div>

      `;

    }).join("");
}


/* =========================
   ADD MATCH
========================= */

async function addMatch() {

  const homeTeam =
    document.getElementById("homeTeam")
      .value.trim();

  const awayTeam =
    document.getElementById("awayTeam")
      .value.trim();

  const stageName =
    document.getElementById("stageSelect")
      .value.trim();

  const kickoffInput =
    document.getElementById("kickoff")
      .value;

  if (
    !homeTeam ||
    !awayTeam ||
    !stageName ||
    !kickoffInput
  ) {

    showMessage(
      "يرجى تعبئة جميع بيانات المباراة.",
      "error"
    );

    return;
  }

  const kickoff =
    new Date(kickoffInput)
      .toISOString();

  const { data, error } =
    await supabaseClient.rpc(
      "add_match",
      {
        p_home_team: homeTeam,
        p_away_team: awayTeam,
        p_stage_name: stageName,
        p_kickoff: kickoff
      }
    );

  if (error) {

    console.error(error);

    showMessage(
      "تعذر إضافة المباراة: " +
      error.message,
      "error"
    );

    return;
  }

  if (!data || !data.success) {

    showMessage(
      "تعذر إضافة المباراة.",
      "error"
    );

    return;
  }

  showMessage(
    "تمت إضافة المباراة بنجاح ✓"
  );

  document.getElementById("homeTeam")
    .value = "";

  document.getElementById("awayTeam")
    .value = "";

  document.getElementById("stageSelect")
    .value = "";

  document.getElementById("kickoff")
    .value = "";

  await loadMatches();
}

/* =========================
   EDIT MATCH
========================= */

async function editMatch(matchId) {

  const { data: match, error } =
    await supabaseClient
      .from("matches")
      .select(`
        *,
        stages (
          name
        )
      `)
      .eq("id", matchId)
      .single();

  if (error || !match) {

    showMessage(
      "تعذر تحميل المباراة.",
      "error"
    );

    return;
  }


  const newHome =
    prompt(
      "اسم Home:",
      match.home_team
    );

  if (newHome === null) {
    return;
  }


  const newAway =
    prompt(
      "اسم الفريق Away:",
      match.away_team
    );

  if (newAway === null) {
    return;
  }


  const newStage =
    prompt(
      "اسم المرحلة:",
      match.stages?.name || ""
    );

  if (newStage === null) {
    return;
  }


  if (!newStage.trim()) {

    showMessage(
      "اسم المرحلة مطلوب.",
      "error"
    );

    return;
  }


  const newKickoff =
    prompt(
      "موعد المباراة بصيغة:\n2026-09-12 20:00",
      formatForInput(match.kickoff)
    );

  if (newKickoff === null) {
    return;
  }


  const parsedDate =
    new Date(
      newKickoff.replace(" ", "T")
    );


  if (isNaN(parsedDate.getTime())) {

    showMessage(
      "صيغة الموعد غير صحيحة.",
      "error"
    );

    return;
  }


  const {
    data: stageId,
    error: stageError
  } =
    await supabaseClient.rpc(
      "get_or_create_stage",
      {
        p_stage_name: newStage.trim()
      }
    );


  if (stageError) {

    console.error(stageError);

    showMessage(
      "تعذر حفظ المرحلة: " +
      stageError.message,
      "error"
    );

    return;
  }


  const { error: updateError } =
    await supabaseClient
      .from("matches")
      .update({
        home_team: newHome.trim(),
        away_team: newAway.trim(),
        stage_id: stageId,
        kickoff: parsedDate.toISOString()
      })
      .eq("id", matchId);


  if (updateError) {

    console.error(updateError);

    showMessage(
      "تعذر تعديل المباراة: " +
      updateError.message,
      "error"
    );

    return;
  }


  showMessage(
    "تم تعديل المباراة بنجاح ✓"
  );

  await loadMatches();
}


/* =========================
   FINISH MATCH
========================= */

async function finishMatch(matchId) {

  const homeInput =
    document.getElementById(
      `home-${matchId}`
    );

  const awayInput =
    document.getElementById(
      `away-${matchId}`
    );


  if (!homeInput || !awayInput) {

    showMessage(
      "لا يمكن إدخال النتيجة.",
      "error"
    );

    return;
  }


  if (
    homeInput.value === "" ||
    awayInput.value === ""
  ) {

    showMessage(
      "أدخل نتيجة المباراة أولًا.",
      "error"
    );

    return;
  }


  const homeScore =
    Number(homeInput.value);

  const awayScore =
    Number(awayInput.value);


  if (
    homeScore < 0 ||
    awayScore < 0
  ) {

    showMessage(
      "النتيجة غير صحيحة.",
      "error"
    );

    return;
  }


  if (
    !confirm(
      `هل تريد إنهاء المباراة بنتيجة ${homeScore} - ${awayScore}؟`
    )
  ) {
    return;
  }


  const { error } =
    await supabaseClient
      .from("matches")
      .update({
        home_score: homeScore,
        away_score: awayScore,
        status: "finished"
      })
      .eq("id", matchId);


  if (error) {

    console.error(error);

    showMessage(
      "حدث خطأ أثناء حفظ النتيجة.",
      "error"
    );

    return;
  }


  showMessage(
    "تم إنهاء المباراة وحفظ النتيجة ✓"
  );


  await loadMatches();
}


/* =========================
   EDIT RESULT
========================= */

async function editResult(matchId) {

 const home =
  prompt(
    "النتيجة الجديدة لـ Home:"
  );

if (home === null) {
  return;
}

const away =
  prompt(
    "النتيجة الجديدة لـ Away:"
  );

if (away === null) {
  return;
}


  const homeScore =
    Number(home);

  const awayScore =
    Number(away);


  if (
    home === "" ||
    away === "" ||
    homeScore < 0 ||
    awayScore < 0 ||
    !Number.isInteger(homeScore) ||
    !Number.isInteger(awayScore)
  ) {

    showMessage(
      "النتيجة غير صحيحة.",

    );

    return;
  }


  if (
    !confirm(
      "تعديل النتيجة قد يتطلب إعادة احتساب النقاط. هل أنت متأكد؟"
    )

/* =========================
   DATE FORMAT
========================= */

function formatDate(dateString) {

  const date =
    new Date(dateString);


  return date.toLocaleString(
    "ar-AE",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


function formatForInput(dateString) {

  const date =
    new Date(dateString);

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      date.getDate()
    ).padStart(2, "0");

  const hours =
    String(
      date.getHours()
    ).padStart(2, "0");

  const minutes =
    String(
      date.getMinutes()
    ).padStart(2, "0");


  return `${year}-${month}-${day} ${hours}:${minutes}`;
}


/* =========================
   SECURITY / HTML
========================= */

function escapeHtml(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
